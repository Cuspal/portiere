name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c requirements/dev.txt ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: mypy src/portiere/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements/dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest --cov=portiere --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: python -c "import portiere; print(f'portiere {portiere.__version__}')"
      - name: Install the wheel's documented quickstart extras
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheel = next(Path("dist").glob("*.whl"))
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheel}[polars,quality]"])
          PY
      - name: Run installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: portiere quickstart --output-dir wheel-quickstart

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t portiere:ci .
      - name: CLI runs
        run: docker run --rm portiere:ci --help
      - name: No-egress guarantee holds in the default image
        run: docker run --rm portiere:ci doctor --assert-no-egress
