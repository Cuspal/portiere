name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise bundled pipeline and replay
        run: python -m pytest tests/test_quickstart.py tests/test_integration.py tests/test_replay_auto.py tests/test_mapping_csv.py -v
